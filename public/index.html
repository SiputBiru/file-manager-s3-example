<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>File Manager S3 Example</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 24px; margin: 0; }
    .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .user input { width: 140px; padding: 4px 8px; }
    form { display: flex; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #8884;
      padding: 8px;
      border-radius: 8px;
    }
    img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: #8882; }
    .meta { flex: 1; min-width: 160px; }
    .meta small { opacity: 0.7; }
    button { cursor: pointer; padding: 4px 8px; }
    .empty { opacity: 0.7; }
    .error { color: #c0392b; min-height: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>File Manager</h1>
    <label class="user">
      User ID
      <input id="user" value="demo-user" />
    </label>
  </header>

  <form id="upload-form">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required />
    <button type="submit">Upload</button>
  </form>

  <div class="error" id="error"></div>
  <ul id="list"></ul>

  <script>
    const list = document.querySelector("#list");
    const errorBox = document.querySelector("#error");
    const userInput = document.querySelector("#user");

    userInput.value = localStorage.getItem("user-id") || "demo-user";
    userInput.addEventListener("change", () => {
      localStorage.setItem("user-id", userInput.value.trim() || "demo-user");
      load();
    });

    function api(path, options = {}) {
      const headers = {
        ...(options.headers || {}),
        "x-user-id": userInput.value.trim() || "demo-user",
      };
      return fetch(path, { ...options, headers });
    }

    function showError(message) {
      errorBox.textContent = message || "";
    }

    async function load() {
      showError("");
      const response = await api("/api/files");
      if (!response.ok) {
        showError("Failed to load file list");
        return;
      }

      const files = await response.json();
      list.innerHTML = "";

      if (files.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No files for this user yet.";
        list.append(li);
        return;
      }

      for (const file of files) {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = file.thumbUrl;
        img.alt = "";

        const meta = document.createElement("div");
        meta.className = "meta";
        const name = document.createElement("strong");
        name.textContent = file.name;
        const detail = document.createElement("small");
        detail.textContent = `${file.width || "?"} x ${file.height || "?"} - ${Math.round(file.size / 1024)} KB`;
        meta.append(name, document.createElement("br"), detail);

        const resize = document.createElement("button");
        resize.textContent = "Resize 800";
        resize.addEventListener("click", () => edit(file.id, { mode: "resize", width: 800 }));

        const crop = document.createElement("button");
        crop.textContent = "Crop 400";
        crop.addEventListener("click", () => edit(file.id, { mode: "square", size: 400 }));

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.addEventListener("click", () => removeFile(file.id));

        li.append(img, meta, resize, crop, remove);
        list.append(li);
      }
    }

    async function upload(file) {
      const initResponse = await api("/api/files/upload-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: file.name,
          contentType: file.type,
          size: file.size,
        }),
      });

      if (!initResponse.ok) {
        const body = await initResponse.json().catch(() => ({}));
        throw new Error(body.error || "Failed to request upload URL");
      }

      const init = await initResponse.json();

      const putResponse = await fetch(init.uploadUrl, {
        method: "PUT",
        headers: { "Content-Type": file.type },
        body: file,
      });

      if (!putResponse.ok) throw new Error("Upload to RustFS failed");

      const confirmResponse = await api("/api/files/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fileId: init.fileId,
          key: init.key,
          name: file.name,
          contentType: file.type,
        }),
      });

      if (!confirmResponse.ok) {
        const body = await confirmResponse.json().catch(() => ({}));
        throw new Error(body.error || "Upload confirmation failed");
      }
    }

    async function edit(id, body) {
      showError("");
      const response = await api(`/api/files/${id}/edit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        showError(data.error || "Edit failed");
        return;
      }

      await load();
    }

    async function removeFile(id) {
      if (!confirm("Delete this file?")) return;
      showError("");
      const response = await api(`/api/files/${id}`, { method: "DELETE" });
      if (!response.ok && response.status !== 404) {
        showError("Delete failed");
        return;
      }
      await load();
    }

    document.querySelector("#upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.querySelector("#file");
      const file = input.files[0];
      if (!file) return;

      showError("");
      const submit = event.target.querySelector("button");
      submit.disabled = true;
      submit.textContent = "Uploading...";

      try {
        await upload(file);
        event.target.reset();
        await load();
      } catch (err) {
        showError(err.message);
      } finally {
        submit.disabled = false;
        submit.textContent = "Upload";
      }
    });

    load();
  </script>
</body>
</html>
